name: MIXORA DJ PRO Windows verified installer
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'installer/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-installer.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify source upload
        shell: pwsh
        run: |
          if (!(Test-Path CMakeLists.txt) -or !(Test-Path src/live/main.cpp) -or !(Test-Path installer/MIXORA.nsi)) {
            throw 'MIXORA 2.5 sources missing from repository root.'
          }
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: 'qtmultimedia'
          cache: true
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DBUILD_TESTING=ON
      - name: Compile
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Bundle Qt and verify real executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'build\Release\MIXORA DJ PRO.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'The compiled MIXORA DJ PRO.exe is missing.' }
          if ((Get-Item -LiteralPath $exe).Length -lt 30000) { throw 'Compiled executable is unexpectedly small.' }
          New-Item -ItemType Directory stage -Force | Out-Null
          Copy-Item -LiteralPath $exe -Destination 'stage\MIXORA DJ PRO.exe'
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --compiler-runtime --no-translations --dir stage 'stage/MIXORA DJ PRO.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Qt deployment failed.' }
          foreach ($name in @('MIXORA DJ PRO.exe','Qt6Core.dll','Qt6Widgets.dll','Qt6Multimedia.dll')) {
            if (!(Test-Path -LiteralPath (Join-Path 'stage' $name))) { throw "Missing staged runtime file: $name" }
          }
          if (!(Test-Path 'stage\platforms\qwindows.dll')) { throw 'Qt Windows platform plugin missing from stage.' }
          Get-ChildItem stage -File | Select-Object Name,Length | Format-Table
      - name: Package corrected installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          $nsis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (!(Test-Path $nsis)) { throw 'NSIS executable not found.' }
          $stagePath = (Resolve-Path stage).Path
          $exePath = Join-Path $PWD 'MIXORA_DJ_PRO_2_5_1_Setup_x64.exe'
          & $nsis "/DSTAGEDIR=$stagePath" "/DOUTPUTFILE=$exePath" 'installer/MIXORA.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'Installer packaging failed.' }
          if (!(Test-Path $exePath)) { throw 'Installer file not generated.' }
          if ((Get-Item $exePath).Length -lt 1000000) { throw 'Installer is unexpectedly small.' }
      - name: Install and launch smoke test on a clean Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'MIXORA_DJ_PRO_2_5_1_Setup_x64.exe').Path
          Write-Host "DEBUG_LAUNCH_INSTALLER=$installer"
          $proc = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru
          if (!$proc.WaitForExit(30000)) {
            Write-Host "DEBUG_INSTALLER_TIMED_OUT_PID=$($proc.Id)"
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'Silent NSIS installation timed out after 30 seconds.'
          }
          Write-Host "DEBUG_INSTALLER_EXIT_CODE=$($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { throw "Silent installer exited with code $($proc.ExitCode)." }
          Write-Host "DEBUG_ENV_LOCALAPPDATA=$env:LOCALAPPDATA"
          Write-Host "DEBUG_ENV_APPDATA=$env:APPDATA"
          Write-Host "DEBUG_ENV_USERPROFILE=$env:USERPROFILE"
          Write-Host "DEBUG_HOME=$HOME"
          $registry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MixoraDJPro' -ErrorAction SilentlyContinue
          if ($registry) { Write-Host "DEBUG_INSTALL_REGISTRY=$($registry | ConvertTo-Json -Compress)" } else { Write-Host 'DEBUG_REGISTRY_MISSING' }
          foreach ($scan in @((Join-Path $env:LOCALAPPDATA 'Programs'),(Join-Path $env:APPDATA 'Programs'),$env:LOCALAPPDATA,$env:ProgramFiles)) {
            if (Test-Path $scan) {
              Write-Host "DEBUG_SEARCH_ROOT=$scan"
              Get-ChildItem -Path $scan -Filter 'MIXORA DJ PRO.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 10 -ExpandProperty FullName | ForEach-Object { Write-Host "DEBUG_FOUND_EXE=$_" }
            }
          }
          $folder = Join-Path $env:LOCALAPPDATA 'Programs\MIXORA DJ PRO'
          $installed = Join-Path $folder 'MIXORA DJ PRO.exe'
          foreach ($name in @('MIXORA DJ PRO.exe','Qt6Core.dll','Qt6Widgets.dll','Qt6Multimedia.dll')) {
            $path = Join-Path $folder $name
            if (!(Test-Path -LiteralPath $path)) { throw "INSTALLATION FAILURE: missing file $path" }
          }
          if (!(Test-Path (Join-Path $folder 'platforms\qwindows.dll'))) { throw 'Missing installed Qt Windows platform plugin.' }
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\MIXORA DJ PRO\MIXORA DJ PRO.lnk'
          if (!(Test-Path -LiteralPath $shortcut)) { throw 'Start Menu shortcut not created.' }
          $shell = New-Object -ComObject WScript.Shell
          $target = $shell.CreateShortcut($shortcut).TargetPath
          if ([IO.Path]::GetFullPath($target) -ine [IO.Path]::GetFullPath($installed)) { throw "Shortcut points to '$target' instead of '$installed'." }
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'MIXORA DJ PRO.lnk'
          if (!(Test-Path -LiteralPath $desktop)) { throw "Desktop shortcut missing: $desktop" }
          Remove-Item Env:\QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:\QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          Write-Host "DEBUG_START_APP=$installed"
          $app = Start-Process -FilePath $installed -ArgumentList '--smoke-test' -WorkingDirectory $folder -PassThru
          if (!$app.WaitForExit(20000)) {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            throw 'Installed MIXORA app startup smoke test timed out after 20 seconds.'
          }
          if ($app.ExitCode -ne 0) { throw "INSTALLED APP LAUNCH FAILED: exit code $($app.ExitCode)" }
          Write-Host "WINDOWS_INSTALL_SMOKE_TEST_OK: Installed EXE, Qt DLLs, Qt platform plugin, Start Menu shortcut, desktop shortcut, and startup passed."
          Get-Item -LiteralPath $installed | Select-Object FullName,Length
      - uses: actions/upload-artifact@v4
        with:
          name: MIXORA_DJ_PRO_2_5_1_Windows_VERIFIED_Setup
          path: MIXORA_DJ_PRO_2_5_1_Setup_x64.exe
          if-no-files-found: error
