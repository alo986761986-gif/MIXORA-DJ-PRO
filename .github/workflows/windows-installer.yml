name: MIXORA DJ PRO Windows installer and portable
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'installer/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-installer.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: 'qtmultimedia'
          cache: true
      - name: Configure CMake
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Run C++ tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Deploy Windows executable and Qt runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'build\Release\MIXORA DJ PRO.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'Compiled executable missing.' }
          New-Item -ItemType Directory stage -Force | Out-Null
          Copy-Item -LiteralPath $exe 'stage\MIXORA DJ PRO.exe'
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --compiler-runtime --no-translations --dir stage 'stage/MIXORA DJ PRO.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Qt deployment failed.' }
          foreach ($name in @('MIXORA DJ PRO.exe','Qt6Core.dll','Qt6Widgets.dll','Qt6Multimedia.dll')) {
            if (!(Test-Path -LiteralPath (Join-Path 'stage' $name))) { throw "Missing runtime file $name" }
          }
          if (!(Test-Path 'stage\platforms\qwindows.dll')) { throw 'Missing Qt platform plugin' }
          Get-Item 'stage\MIXORA DJ PRO.exe' | Select-Object FullName, Length
      - name: Prepare portable ZIP as installation-free fallback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path 'stage\*' -DestinationPath 'MIXORA_DJ_PRO_2_6_PORTABLE_x64.zip' -CompressionLevel Optimal
          if (!(Test-Path 'MIXORA_DJ_PRO_2_6_PORTABLE_x64.zip')) { throw 'Portable package missing' }
      - name: Build installer using Inno Setup instead of NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $iscc)) { throw 'Inno Setup compiler not found' }
          $stageDir = (Resolve-Path 'stage').Path
          $outDir = (Get-Location).Path
          & $iscc "/DStageDir=$stageDir" "/O$outDir" 'installer/MIXORA.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno installer packaging failed' }
          if (!(Test-Path 'MIXORA_DJ_PRO_2_6_Setup_x64.exe')) { throw 'Installer EXE not generated' }
          Get-Item 'MIXORA_DJ_PRO_2_6_Setup_x64.exe' | Select-Object FullName,Length
      - name: Verify real installation and EXE launch on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exeSetup = (Resolve-Path 'MIXORA_DJ_PRO_2_6_Setup_x64.exe').Path
          $installerLog = Join-Path $env:TEMP 'mixora-install.log'
          $p = Start-Process -FilePath $exeSetup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$installerLog") -PassThru
          if (!$p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Inno installer timed out after 60 seconds'
          }
          if ($p.ExitCode -ne 0) {
            if (Test-Path $installerLog) { Get-Content $installerLog -Tail 80 }
            throw "Inno installation returned exit code $($p.ExitCode)"
          }
          $folder = Join-Path $env:LOCALAPPDATA 'Programs\MIXORA DJ PRO'
          $installed = Join-Path $folder 'MIXORA DJ PRO.exe'
          foreach ($name in @('MIXORA DJ PRO.exe','Qt6Core.dll','Qt6Widgets.dll','Qt6Multimedia.dll')) {
            $target = Join-Path $folder $name
            if (!(Test-Path -LiteralPath $target)) {
              if (Test-Path $installerLog) { Get-Content $installerLog -Tail 80 }
              throw "MISSING_INSTALLED_FILE: $target"
            }
          }
          if (!(Test-Path (Join-Path $folder 'platforms\qwindows.dll'))) { throw 'Missing installed Qt Windows platform plugin' }
          $menuLink = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\MIXORA DJ PRO.lnk'
          if (!(Test-Path -LiteralPath $menuLink)) { throw "Missing Start Menu shortcut: $menuLink" }
          $wsh = New-Object -ComObject WScript.Shell
          $actualLinkTarget = $wsh.CreateShortcut($menuLink).TargetPath
          if ([IO.Path]::GetFullPath($actualLinkTarget) -ine [IO.Path]::GetFullPath($installed)) { throw "Wrong shortcut target: $actualLinkTarget" }
          $desktopLink = Join-Path ([Environment]::GetFolderPath('Desktop')) 'MIXORA DJ PRO.lnk'
          if (!(Test-Path -LiteralPath $desktopLink)) { throw "Missing desktop shortcut: $desktopLink" }
          Remove-Item Env:\QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:\QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $smoke = Start-Process -FilePath $installed -ArgumentList '--smoke-test' -WorkingDirectory $folder -PassThru
          if (!$smoke.WaitForExit(25000)) {
            Stop-Process -Id $smoke.Id -Force -ErrorAction SilentlyContinue
            throw 'Installed app startup smoke test timed out'
          }
          if ($smoke.ExitCode -ne 0) { throw "Installed app startup error $($smoke.ExitCode)" }
          Write-Host 'MIXORA_WINDOWS_INSTALL_VERIFIED: exe, Qt libraries, shortcuts and app startup all passed.'
      - uses: actions/upload-artifact@v4
        with:
          name: MIXORA_DJ_PRO_2_6_Setup_WINDOWS_VERIFIED
          path: MIXORA_DJ_PRO_2_6_Setup_x64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MIXORA_DJ_PRO_2_6_PORTABLE_WINDOWS_VERIFIED
          path: MIXORA_DJ_PRO_2_6_PORTABLE_x64.zip
          if-no-files-found: error
